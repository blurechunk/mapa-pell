<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tria de fotos</title>
<style>
:root{--bg:#f6f4ef;--sf:#fff;--sf2:#efece5;--ink:#1f1d1a;--mut:#6b665d;--ln:#ddd8cd;--acc:#8a3b2e;--acc2:#f3e3df;--ok:#2f6b3a;--okb:#e2efe2;--warn:#8a5a00;--warnb:#f8ecd2;--bad:#9b1c1c;--badb:#f7dede}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--sf:#211f1c;--sf2:#2a2824;--ink:#ece8e1;--mut:#a39d92;--ln:#3a3731;--acc:#e09a8a;--acc2:#3a2723;--ok:#8fcf98;--okb:#1f3323;--warn:#e6b85c;--warnb:#3a2f17;--bad:#f09999;--badb:#3d1f1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:5px 10px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){button.pri{color:#1a1310}}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:5px 8px}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
header h1{font-size:17px;margin:0 8px 0 0}
#prog{color:var(--mut)}
.sp{flex:1}
main{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 56px)}
@media (max-width:820px){main{grid-template-columns:1fr}#llista{max-height:40vh;position:static;border-right:none;border-bottom:1px solid var(--ln)}header{position:static}}
#llista{border-right:1px solid var(--ln);overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px;background:var(--sf)}
#filtres{padding:10px;display:grid;gap:6px;border-bottom:1px solid var(--ln)}
#filtres label{display:flex;gap:6px;align-items:center;color:var(--mut)}
.grp{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:10px 12px 4px}
.fx{padding:4px 12px 2px;font-weight:600}
.ob{display:flex;gap:8px;align-items:flex-start;padding:5px 12px 5px 22px;cursor:pointer;border-left:3px solid transparent}
.ob:hover{background:var(--sf2)}
.ob.on{background:var(--acc2);border-left-color:var(--acc)}
.ob .t{flex:1}
.pill{font-size:11px;border-radius:9px;padding:0 6px;white-space:nowrap;border:1px solid var(--ln);color:var(--mut)}
.pill.F{border-color:var(--acc);color:var(--acc)}
.pill.G{border-color:var(--ok);color:var(--ok)}
.pill.n{background:var(--okb);color:var(--ok);border-color:transparent}
.pill.cap{background:var(--sf2)}
#panell{padding:16px 20px 60px;min-width:0}
.cap1{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.cap1 h2{margin:0;font-size:20px}
.mut{color:var(--mut)}
.caixa{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:10px 0}
.avis{background:var(--warnb);color:var(--warn);border-radius:6px;padding:6px 10px;margin:8px 0}
.ja{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.ja figure{margin:0;width:110px;flex:none;font-size:11px;color:var(--mut)}
.ja img{width:110px;height:80px;object-fit:cover;border-radius:4px;background:var(--sf2);display:block}
.cerca{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cerca input[type=search]{flex:1;min-width:220px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 0}
.tabs button{border-radius:6px 6px 0 0;border-bottom:none}
.tabs button.on{background:var(--acc2);border-color:var(--acc)}
#res{border-top:1px solid var(--ln);padding-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.rc{background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.rc.tria{outline:3px solid var(--ok)}
.rc .im{position:relative;background:var(--sf2);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.rc .im img{max-width:100%;max-height:100%;object-fit:contain}
.rc .bd{padding:7px 9px;display:grid;gap:4px;font-size:12.5px;flex:1}
.rc .ds{color:var(--mut);max-height:4.5em;overflow:hidden}
.rc .ds.obert{max-height:none}
.rc .ac{display:flex;gap:6px;padding:0 9px 9px;flex-wrap:wrap}
.lic{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;justify-self:start}
.lic.ok{background:var(--okb);color:var(--ok)}
.lic.ver{background:var(--warnb);color:var(--warn)}
.lic.no{background:var(--badb);color:var(--bad)}
.usada{position:absolute;inset:auto 6px 6px auto;background:var(--badb);color:var(--bad);font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px}
#triades .it{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:start;border-top:1px solid var(--ln);padding:8px 0}
#triades .it:first-child{border-top:none}
#triades img{width:120px;height:90px;object-fit:cover;border-radius:4px;background:var(--sf2)}
#triades .it textarea{width:100%;min-height:36px}
.drop{border:2px dashed var(--ln);border-radius:8px;padding:12px;text-align:center;color:var(--mut)}
.drop.sobre{border-color:var(--acc);background:var(--acc2)}
.form2{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center}
.form2 input,.form2 select,.form2 textarea{width:100%}
@media (max-width:600px){.form2{grid-template-columns:1fr}}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
#lb img{max-width:95vw;max-height:92vh}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:30;max-width:90vw}
details summary{cursor:pointer;color:var(--acc)}
.carrega{color:var(--mut);padding:12px 0}
</style>
</head>
<body>
<header>
 <h1>Tria de fotos · Mapa de la pell</h1>
 <span id="prog"></span>
 <span class="sp"></span>
 <button id="bAjuda">Com funciona?</button>
 <button id="bImporta" title="Recupera una selecció exportada abans">Importa</button>
 <button id="bExporta" class="pri">Exporta el zip</button>
 <input type="file" id="fImporta" accept=".zip,.json" hidden>
</header>
<main>
 <nav id="llista">
  <div id="filtres">
   <input type="search" id="fText" placeholder="Filtra per fitxa o forma…">
   <label><input type="checkbox" id="fF" checked> Formes sense foto</label>
   <label><input type="checkbox" id="fP" checked> Parts importants</label>
   <label><input type="checkbox" id="fG" checked> Termes del glossari</label>
   <label><input type="checkbox" id="fPend"> Només les pendents</label>
  </div>
  <div id="obs"></div>
 </nav>
 <section id="panell"></section>
</main>
<div id="lb"><img alt=""></div>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

 if(/^gfdl/i.test(s))return {ok:true,t:"GFDL"};
 return {ok:false,t:s};}
function licOV(r){const m={by:"CC BY","by-sa":"CC BY-SA",cc0:"CC0",pdm:"Domini públic"};const b=m[r.license];

 const cap=OBS().filter(o=>S.cap[kOb(o)]&&!(S.sel[kOb(o)]||[]).length).map(o=>({fitxa:o.f,part:o.p}));
 if(!items.length&&!cap.length){toast("Encara no has triat cap foto.");return;}
 const zip=new JSZip(),man=[],falten=[];let n=0;const b0=$("#bExporta");b0.disabled=true;
 for(const [o,it] of items){n++;b0.textContent=`Baixant ${n}/${items.length}…`;
  const nom=`${o.f.replace("glos:","glossari-")}__${slug(o.p)}__${String(n).padStart(3,"0")}`;let fitxer=null,error=null;
  try{const b=await baixa(it);fitxer=nom+ext(b);zip.file("fotos/"+fitxer,b);}catch(e){error=String(e.message||e);falten.push(o.p+": "+it.titol);}
  const fx=FX[o.f];man.push({desti:fx.glos?"glossari":"fitxa",glossari:fx.glos||null,glossari_nou:!!fx.nou,fitxa:fx.glos?null:o.f,fitxa_nom:fx.glos?null:fx.n,surt_a:fx.glos?fx.apareix:null,part:o.p,tipus:o.t==="F"?"forma sense foto":o.t==="N"?"part nova":o.t==="G"?"terme del glossari":"part important",que_sha_de_veure:o.v||"",
   font:it.font,titol:it.titol,pagina:it.pagina,imatge_url:it.local?null:it.img,autor:it.autor,llicencia:it.lic,llicencia_url:it.licUrl||"",per_verificar:!!it.verificar,
   descripcio_original:it.desc||"",cara:!!it.cara,nota:it.nota||"",fitxer,error,mida:it.amp?[it.amp,it.alc]:null});}
 zip.file("manifest.json",JSON.stringify({versio:1,data:new Date().toISOString(),fotos:man,sense_foto_bona:cap,parts_noves:S.custom},null,1));
 b0.textContent="Comprimint…";
 const blob=await zip.generateAsync({type:"blob"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fotos-mapa-pell-"+new Date().toISOString().slice(0,10)+".zip";document.body.appendChild(a);a.click();a.remove();
 b0.disabled=false;b0.textContent="Exporta el zip";
 if(falten.length)alert("Zip generat, però no s'han pogut baixar "+falten.length+" imatges (el navegador no les deixa baixar des d'aquesta pàgina):\n\n• "+falten.join("\n• ")+"\n\nSón al manifest amb l'enllaç. Si vols, desa-les des de la font i afegeix-les a la pestanya «Altres webs (a mà)».");
 else toast("Zip generat amb "+items.length+" fotos.");}
$("#bExporta").onclick=exporta;

/* ---------- Importació (recupera una selecció) ---------- */
$("#bImporta").onclick=()=>$("#fImporta").click();
$("#fImporta").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let m,zip=null;
 if(/\.zip$/i.test(f.name)){zip=await JSZip.loadAsync(f);m=JSON.parse(await zip.file("manifest.json").async("string"));}else m=JSON.parse(await f.text());
 if(m.parts_noves)for(const o of m.parts_noves)if(!S.custom.some(x=>kOb(x)===kOb(o)))S.custom.push(o);
 let n=0;for(const x of m.fotos||[]){const k=(x.desti==="glossari"?"glos:"+x.glossari:x.fitxa)+"|"+x.part;const L=S.sel[k]||(S.sel[k]=[]);
  const id=(x.imatge_url?"u:"+x.imatge_url:"m:"+x.fitxer);if(L.some(y=>y.id===id||(y.pagina===x.pagina&&y.titol===x.titol)))continue;
  const it={font:x.font,id,titol:x.titol,pagina:x.pagina,img:x.imatge_url,mini:x.imatge_url,autor:x.autor,lic:x.llicencia,licUrl:x.llicencia_url,licOk:true,verificar:x.per_verificar,desc:x.descripcio_original,cara:x.cara,nota:x.nota};
  if(!x.imatge_url&&zip&&x.fitxer){const b=await zip.file("fotos/"+x.fitxer).async("blob");it.local=true;BL[id]=b;idbPut(id,b);}
  L.push(it);n++;}
 for(const c of m.sense_foto_bona||[])S.cap[c.fitxa+"|"+c.part]=1;
 desa();render();toast(n+" fotos recuperades.");}catch(err){toast("No s'ha pogut llegir: "+err.message);}e.target.value="";};

/* ---------- Ajuda ---------- */
const AJUDA=`<h2>Com funciona</h2>
<ol>
<li>Tria a l'esquerra un objectiu. «Forma»: la forma encara no té cap foto. «Part»: una localització, un estadi o un signe que la foto actual no mostra. «Glossari»: un signe o terme que surt en més d'una fitxa; la foto anirà al desplegable del glossari, no a la galeria d'una fitxa.</li>
<li>Cerca a <b>Wikimedia Commons</b>, <b>CDC PHIL</b> (les imatges de PHIL que són a Commons), <b>Articles (Europe PMC)</b> (figures d'articles d'accés obert amb llicència CC BY, CC BY-SA o CC0) o <b>Openverse</b> (Flickr i altres arxius). Només es mostren fotos amb llicència CC BY, CC BY-SA, CC0 o de domini públic. Les fotos de Commons que ja són a la guia surten marcades i no es poden triar.</li>
<li>Llegeix la descripció original per comprovar que la foto és de debò d'aquella forma. Pots triar-ne més d'una per objectiu si mostren coses diferents.</li>
<li>Si la persona és identificable, deixa marcat «Surt la cara»: taparé els ulls o retallaré.</li>
<li>Per a imatges que no surtin a cap pestanya (el web de PHIL, Open-i…), desa la imatge i afegeix-la a la pestanya «Altres webs (a mà)» amb l'adreça de la pàgina.</li>
<li>Si mires un objectiu i no hi ha res adequat, marca «No hi ha cap foto bona».</li>
<li>Quan acabis, <b>Exporta el zip</b> i envia-me'l. La selecció es desa al navegador: pots plegar i continuar un altre dia (o recuperar-la amb «Importa» des del zip).</li>
</ol>
<p class="mut">Abans d'incorporar res comprovaré la llicència i l'autor de cada foto (sobretot les d'Openverse, d'Europe PMC i les afegides a mà), que correspon a la forma i que no està repetida a la guia.</p>
<p><button id="bNova">+ Proposa una part nova</button></p>`;
$("#bAjuda").onclick=()=>{ACT=null;renderLlista();renderPanell();bindAjuda();};
function bindAjuda(){const b=$("#bNova");if(b)b.onclick=partNova;}
function render(){renderLlista();renderPanell();bindAjuda();}
render();
</script>
